  </g>
  <!-- V -->
  <text x="47" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="26" fill="#F5F6F7">V</text>
  <!-- E -->
  <text x="67" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="26" fill="#F5F6F7">E</text>
</svg>
