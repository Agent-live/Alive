<svg width="120" height="32" viewBox="0 0 120 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A -->
  <text x="0" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="26" fill="#F5F6F7">A</text>
  <!-- L -->
  <text x="18" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="26" fill="#F5F6F7">L</text>
  <!-- I — The Living Letter -->
