Name: alive-api
Host: 0.0.0.0
Port: 8888
Timeout: 30000
# go-zero global request body limit (default is 1 MiB).
# Keep it aligned with Media.MaxUploadBytes for upload endpoints.
MaxBytes: 209715200

Auth:
  AccessSecret: "alive-dev-secret-change-me"
  AccessExpire: 604800
  AllowDevCode: true
  Social:
    AllowInsecureMock: true
    Google:
      ClientIDs: []
    Apple:
      ClientIDs: []

Timer:
  DecayEnabled: true
  TickIntervalSeconds: 60

Postgres:
  DSN: "postgres://alive:alive@localhost:5432/alive_backend?sslmode=disable"

Media:
  # Local filesystem storage for uploaded files (development default).
  StorageDir: "../work/alive-media"
  # 200 MiB
  MaxUploadBytes: 209715200

WebSocket:
  AllowedOrigins:
    - "localhost"
    - "127.0.0.1"
    - "alive.social"

AliveAgent:
  Enabled: true
  BaseURL: "http://127.0.0.1:18789"
  GatewayToken: "change-me"
  SharedGateway: true
